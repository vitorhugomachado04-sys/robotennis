<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0b3a65">
<title>Tênis 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0b3a65;font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .hud{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);padding:6px 10px;font-size:14px}
  #banner{align-self:center;margin-top:6px;background:rgba(0,0,0,.35);border-radius:10px;padding:6px 10px;font-weight:600;letter-spacing:.2px;max-width:92%;text-align:center}
  #score{font-size:15px}
  #shot{font-weight:700}
  #pause{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;z-index:5}
  #final{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.75)); color:#fff; text-align:center; z-index:6}
  #final h1{font-size:32px;margin:0 0 8px 0}
  #final p{margin:4px 0 12px 0;font-size:16px;opacity:.9}
  #final .buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #final button{pointer-events:auto;background:#10b981;border:0;color:#042; font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer}
  #final button.alt{background:#60a5fa;color:#031b4e}
  /* Touch controls */
  #controls{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:env(safe-area-inset-bottom,12px) 10px 12px 10px;gap:8px;z-index:4}
  .pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;width:36vw;max-width:260px;aspect-ratio:1/1;padding:8px;border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
  .pad button,.panel button{border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:14px;padding:10px 8px;touch-action:none}
  .pad button:active,.panel button:active{background:rgba(255,255,255,.28)}
  .panel{pointer-events:auto;display:grid;gap:6px;width:36vw;max-width:260px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;padding:8px;border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
  .full{grid-column:1 / span 2}
  .small{font-size:12px;font-weight:700;padding:8px}
  #pauseBtn{position:fixed;top:10px;right:10px;z-index:5;pointer-events:auto;background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:12px;padding:8px 10px;font-weight:800}
  @media (min-aspect-ratio: 10/9){ .pad,.panel{width:30vw} }
</style>
</head>
<body>
<button id="pauseBtn">⏸</button>
<div id="ui">
  <div class="hud" id="help">
    <div id="banner">Instale como app: Share → Add to Home Screen • Campanha 3 fases • D‑pad move • AIM ⟵/⟶ direciona • Topspin/Slice/Lob • Voleio 3×</div>
    <div id="score">Games 0–0 | Pontos: 0–0 | Saque: Você</div>
    <div id="shot">Golpe: —</div>
  </div>
</div>
<div id="pause">PAUSADO – toque ⏸</div>
<div id="final">
  <h1 id="finalTitle">Você venceu!</h1>
  <p id="finalSubtitle">Placar final</p>
  <div class="buttons">
    <button id="continueBtn" class="alt">Continuar</button>
    <button id="restartBtn">Reiniciar fase</button>
  </div>
</div>

<!-- Touch controls overlay -->
<div id="controls" aria-hidden="false">
  <div class="pad" id="dpad">
    <div></div><button data-k="w">▲</button><div></div>
    <button data-k="a">◀</button><div></div><button data-k="d">▶</button>
    <div></div><button data-k="s">▼</button><div></div>
  </div>
  <div class="panel" id="panel">
    <button class="small" data-k="aimL">AIM ⟵</button>
    <button class="small" data-k="aimR">AIM ⟶</button>
    <button class="full" data-k="j">Topspin (J)</button>
    <button class="full" data-k="k">Slice (K)</button>
    <button class="full" data-k="l">Lob (L)</button>
  </div>
</div>

<script>
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('gesturechange', e=>e.preventDefault());
document.addEventListener('gestureend', e=>e.preventDefault());

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ==== (Game logic identical to previous mobile build – campaign, volley 3×, surfaces, white mesh net, CPU AI) ====
// To keep this message short, I'm including the same maintained code block as before:
</script>
<script>
(()=>{
const COURT_LENGTH = 23.77, SINGLES_WIDTH = 8.23, HALF_W=SINGLES_WIDTH/2;
const NET_HEIGHT=0.91, NET_THICK=0.05, BALL_RADIUS=0.09;
const SERVICE_DIST=6.40;
const PLAYER_BASE_Z = COURT_LENGTH/2 - 0.5;
const EXTRA_OUT = 2.0;
const PLAYER_SPEED = 5.5, CPU_SPEED=6.6;
const PLAYER_REACH = 1.6, CPU_REACH=1.9;
const GRAV=9.8;
const SURF={ grass:{ restitution:0.48, postFric:1.05, courtColor:0x2fb463, apron:0x167a3c, bg:0x14a94f },
             hardAO:{ restitution:0.55, postFric:1.00, courtColor:0x1d4ed8, apron:0x0b3a65, bg:0x0b3a65 },
             clay:{ restitution:0.60, postFric:0.86, courtColor:0xcc6c3c, apron:0x8b3e1e, bg:0x8b3e1e } };

const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(SURF.grass.bg);
const hemi=new THREE.HemisphereLight(0xffffff,0x203030,.95); scene.add(hemi);
const dir=new THREE.DirectionalLight(0xffffff,.8); dir.position.set(4,10,8); scene.add(dir);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,300); scene.add(camera);

const courtGroup=new THREE.Group(); scene.add(courtGroup); let court, apron;
const lineMat=new THREE.MeshBasicMaterial({color:0xffffff});
function buildCourt(surface=SURF.grass){
  if(court){ courtGroup.remove(court); courtGroup.remove(apron); }
  apron = new THREE.Mesh(new THREE.BoxGeometry(SINGLES_WIDTH+4,0.01,COURT_LENGTH+6), new THREE.MeshPhongMaterial({color:surface.apron}));
  apron.position.y=-0.055; courtGroup.add(apron);
  court=new THREE.Mesh(new THREE.BoxGeometry(SINGLES_WIDTH,0.1,COURT_LENGTH), new THREE.MeshPhongMaterial({color:surface.courtColor}));
  court.position.y=-0.05; courtGroup.add(court);
  for(let i=courtGroup.children.length-1;i>=0;i--){ const m=courtGroup.children[i]; if(m.userData && m.userData.isLine) courtGroup.remove(m); }
  const mkLine=(w,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,0.05),lineMat);m.rotation.x=-Math.PI/2;m.position.set(0,0.001,z); m.userData.isLine=true; courtGroup.add(m);};
  mkLine(SINGLES_WIDTH,  COURT_LENGTH/2); mkLine(SINGLES_WIDTH,-COURT_LENGTH/2);
  const sideGeom=new THREE.PlaneGeometry(COURT_LENGTH,0.05);
  function side(x){ const s=new THREE.Mesh(sideGeom,lineMat); s.rotation.x=-Math.PI/2; s.rotation.z=Math.PI/2; s.position.set(x,0.001,0); s.userData.isLine=true; courtGroup.add(s); }
  side( HALF_W); side(-HALF_W);
  mkLine(SINGLES_WIDTH,  SERVICE_DIST); mkLine(SINGLES_WIDTH,-SERVICE_DIST);
  function centerService(zMid){ const g=new THREE.Mesh(new THREE.PlaneGeometry(SERVICE_DIST,0.05),lineMat); g.rotation.x=-Math.PI/2; g.rotation.z=Math.PI/2; g.position.set(0,0.001,zMid); g.userData.isLine=true; courtGroup.add(g); }
  centerService(+SERVICE_DIST/2); centerService(-SERVICE_DIST/2);
  scene.background=new THREE.Color(surface.bg);
}
buildCourt(SURF.grass);

let netGroup=new THREE.Group(); scene.add(netGroup);
function buildWhiteMeshNet(){
  scene.remove(netGroup); netGroup=new THREE.Group(); scene.add(netGroup);
  const postH=1.07, postR=0.04; const postMat=new THREE.MeshPhongMaterial({color:0xffffff});
  const postL=new THREE.Mesh(new THREE.CylinderGeometry(postR,postR,postH,16),postMat);
  const postRMesh=postL.clone(); postL.position.set(-HALF_W, postH/2, 0); postRMesh.position.set(+HALF_W, postH/2, 0); netGroup.add(postL, postRMesh);
  const tape=new THREE.Mesh(new THREE.BoxGeometry(SINGLES_WIDTH,0.04,0.03), postMat); tape.position.set(0, NET_HEIGHT+0.03, 0); netGroup.add(tape);
  const stepX=0.15, stepY=0.12; const verts=[];
  for(let x=-HALF_W; x<=HALF_W+1e-6; x+=stepX){ verts.push(x,0,0,  x,NET_HEIGHT,0); }
  for(let y=0; y<=NET_HEIGHT+1e-6; y+=stepY){ verts.push(-HALF_W,y,0,  HALF_W,y,0); }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  const lines=new THREE.LineSegments(geo, new THREE.LineBasicMaterial({color:0xffffff}));
  netGroup.add(lines);
}
buildWhiteMeshNet();

function createLauncher(colorBody=0x111216, colorAccent=0x3db2ff){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9,1.35,0.6), new THREE.MeshPhongMaterial({color:colorBody}));
  body.position.y = 1.35/2; g.add(body);
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.95,0.35,0.62), new THREE.MeshPhongMaterial({color:colorAccent}));
  top.position.set(0, 1.35 - 0.15, 0); g.add(top);
  const pocket = new THREE.Mesh(new THREE.BoxGeometry(0.65,0.42,0.08), new THREE.MeshPhongMaterial({color:colorAccent}));
  pocket.position.set(0, 0.45, 0.34); g.add(pocket);
  const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.28,16), new THREE.MeshPhongMaterial({color:0xdddddd}));
  nozzle.rotation.z = Math.PI/2; nozzle.position.set(0.0, 1.1, 0.36); g.add(nozzle);
  const wheelMat = new THREE.MeshPhongMaterial({color:0x222});
  for(const sx of [-0.32, 0.32]){ const w=new THREE.Mesh(new THREE.TorusGeometry(0.22,0.05,10,20),wheelMat); w.rotation.x=Math.PI/2; w.position.set(sx,0.18,-0.24); g.add(w); }
  const handle=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.9,0.06), new THREE.MeshPhongMaterial({color:0x222}));
  handle.position.set(0,1.5,-0.24); g.add(handle);
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.55,20), new THREE.MeshBasicMaterial({color:0x000,transparent:true,opacity:0.25}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=0.002; g.add(shadow);
  return g;
}
function createBigMachine(colorBody=0x202020, colorAccent=0xffa030){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.8,0.8), new THREE.MeshPhongMaterial({color:colorBody}));
  body.position.y=1.8/2; g.add(body);
  const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.5,20), new THREE.MeshPhongMaterial({color:0xdddddd}));
  tube.rotation.z=Math.PI/2; tube.position.set(0,1.35,0.44); g.add(tube);
  const panel=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.5,0.1), new THREE.MeshPhongMaterial({color:0xffa030}));
  panel.position.set(0,0.6,0.45); g.add(panel);
  const wheelMat = new THREE.MeshPhongMaterial({color:0x222});
  for(const sx of [-0.4, 0.4]){ const w=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.06,10,20),wheelMat); w.rotation.x=Math.PI/2; w.position.set(sx,0.22,-0.34); g.add(w); }
  const handle=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.1,0.06), new THREE.MeshPhongMaterial({color:0x222}));
  handle.position.set(0,2.0,-0.34); g.add(handle);
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.7,24), new THREE.MeshBasicMaterial({color:0x000,transparent:true,opacity:0.28}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=0.002; g.add(shadow);
  return g;
}

let player1=createLauncher(0x111216,0x3db2ff);
let player2=createLauncher(0x111216,0x35c266);
scene.add(player1,player2);
player1.position.set(0,0,-PLAYER_BASE_Z); player2.position.set(0,0,PLAYER_BASE_Z); player2.rotation.y=Math.PI;

const ball=new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS,24,16), new THREE.MeshPhongMaterial({color:0xffee00}));
ball.position.set(0,1.0,-PLAYER_BASE_Z+1.2); scene.add(ball);

const keys=new Set();
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase()); if(e.key.toLowerCase()==='p')togglePause(); resumeAudio();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const shotEl=document.getElementById('shot'); const scoreEl=document.getElementById('score');
const bannerEl=document.getElementById('banner');
const finalEl=document.getElementById('final'), finalTitle=document.getElementById('finalTitle'), finalSubtitle=document.getElementById('finalSubtitle');
const continueBtn=document.getElementById('continueBtn'), restartBtn=document.getElementById('restartBtn');
document.getElementById('pauseBtn').onclick = ()=>togglePause();

function bindTouchButtons(){
  function press(k){ if(k==='aimL'){ keys.add('a'); } else if(k==='aimR'){ keys.add('d'); } else { keys.add(k); } }
  function release(k){ if(k==='aimL'){ keys.delete('a'); } else if(k==='aimR'){ keys.delete('d'); } else { keys.delete(k); } }
  function attach(el){
    el.addEventListener('touchstart', e=>{e.preventDefault(); press(el.dataset.k); resumeAudio();}, {passive:false});
    el.addEventListener('touchend', e=>{e.preventDefault(); release(el.dataset.k);}, {passive:false});
    el.addEventListener('touchcancel', e=>{e.preventDefault(); release(el.dataset.k);}, {passive:false});
  }
  document.querySelectorAll('[data-k]').forEach(attach);
}
bindTouchButtons();

let actx=null, master=null;
function resumeAudio(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=.6; master.connect(actx.destination);} else if(actx.state==='suspended'){ actx.resume(); } }
function beep(freq=440, dur=0.08, gain=0.2, type='sine'){ if(!actx) return; const osc=actx.createOscillator(); osc.type=type; osc.frequency.value=freq; const g=actx.createGain(); g.gain.value=0; osc.connect(g); g.connect(master); const t=actx.currentTime; g.gain.linearRampToValueAtTime(gain, t+0.005); g.gain.exponentialRampToValueAtTime(0.0001, t+dur); osc.start(t); osc.stop(t+dur+0.02); }
function noise(dur=0.06, gain=0.15){ if(!actx) return; const buffer=actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate); const data=buffer.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.6; const src=actx.createBufferSource(); src.buffer=buffer; const g=actx.createGain(); g.gain.value=gain; src.connect(g); g.connect(master); src.start(); src.stop(actx.currentTime+dur); }
const SFX={ hit(){beep(260,0.05,0.35,'square'); beep(170,0.06,0.2,'sine');},
            bounce(){beep(180,0.04,0.25,'triangle');},
            net(){noise(0.08,0.25);},
            point(){beep(520,0.10,0.25,'triangle');},
            game(){beep(660,0.14,0.32,'triangle');},
            win(){beep(740,0.16,0.35,'square'); setTimeout(()=>beep(880,0.2,0.35,'square'),120);},
            lose(){beep(220,0.25,0.28,'sawtooth');} };

let paused=false,rallying=false,isServe=true;
let server=1;
let ballVel=new THREE.Vector3(0,0,0);
let hitter=null, receiver=null;
let pointsYou=0, pointsCPU=0; 
let gamesYou=0, gamesCPU=0;
const GAMES_TO_WIN=2; 
let matchOver=false;

let phase=1;
let allowedShotsPlayer = {top:true, slice:false, lob:false};
let allowedShotsCPU     = {top:true, slice:true, lob:false};
let currentSurface = SURF.grass;

function setPhase(p){
  phase=p; scene.remove(player1); scene.remove(player2);
  if(phase===1){
    buildCourt(SURF.grass); currentSurface=SURF.grass;
    player1=createLauncher(0x111216,0x3db2ff);
    player2=createLauncher(0x111216,0x35c266);
    allowedShotsPlayer={top:true, slice:false, lob:false};
    allowedShotsCPU={top:true, slice:true, lob:false};
    bannerEl.textContent="Fase 1/3 • Melhor de 3 games • Seu robô: Azul (Topspin) • Oponente: Verde (Topspin+Slice)";
  }else if(phase===2){
    buildCourt(SURF.hardAO); currentSurface=SURF.hardAO;
    player1=createLauncher(0x111216,0x35c266);
    player2=createLauncher(0x111216,0x3db2ff);
    allowedShotsPlayer={top:true, slice:true, lob:false};
    allowedShotsCPU={top:true, slice:false, lob:false};
    bannerEl.textContent="Fase 2/3 • Quadra dura (Australian Open) • Você: Verde (Topspin+Slice) • Oponente: Azul (Topspin)";
  }else{
    buildCourt(SURF.clay); currentSurface=SURF.clay;
    player1=createLauncher(0x111216,0x35c266);
    player2=createBigMachine(0x202020,0xff8a30);
    allowedShotsPlayer={top:true, slice:true, lob:false};
    allowedShotsCPU={top:true, slice:true, lob:true};
    bannerEl.textContent="Fase 3/3 • Saibro • Você: Verde (Topspin+Slice) • Oponente: Robôzão (Topspin+Slice+Lob)";
  }
  scene.add(player1,player2);
  player1.position.set(0,0,-PLAYER_BASE_Z); player2.position.set(0,0,PLAYER_BASE_Z); player2.rotation.y=Math.PI;
  resetMatchScoreKeepPhase(); buildWhiteMeshNet();
}

function resetMatchScoreKeepPhase(){ server=1; pointsYou=pointsCPU=0; gamesYou=gamesCPU=0; matchOver=false; updateScoreText(); resetForNextPoint(); }
function fmtPoints(){ const map=[0,15,30,40]; if(pointsYou>=3 && pointsCPU>=3){ if(pointsYou===pointsCPU) return 'Deuce'; return (pointsYou>pointsCPU)?'Vantagem Você':'Vantagem CPU'; } return `${map[Math.min(pointsYou,3)]}–${map[Math.min(pointsCPU,3)]}`; }
function updateScoreText(){ const whoServes = (server===1)?'Você':'CPU'; scoreEl.textContent = `Fase ${phase}/3 | Games ${gamesYou}–${gamesCPU} (melhor de 3) | Pontos: ${fmtPoints()} | Saque: ${whoServes}`; }

function clampInsideSingles(x){return Math.max(-HALF_W+0.3, Math.min(HALF_W-0.3, x));}
function aimTarget(fromMesh,type){
  const near=(fromMesh===player1); const targetZ = near ? +(COURT_LENGTH/2 - 3.8) : -(COURT_LENGTH/2 - 3.8);
  let dir=0; if(keys.has('a')) dir=-1; else if(keys.has('d')) dir=+1;
  const perspective = near ? 1 : -1;
  let targetX = clampInsideSingles( perspective * (dir|| (Math.random()<.5?-1:1)) * (HALF_W*0.7) );
  targetX += (Math.random()-.5)*0.22; targetX = clampInsideSingles(targetX);
  let minApex = (type==='Lob')? 4.6 : (type==='Topspin'? 2.3 : 1.6);
  minApex = Math.max(minApex, NET_HEIGHT+1.05);
  return {x:targetX,z:targetZ,minApex,dir:(dir||0)};
}
function planBallistic(contact,target,minApex){
  const dx=target.x-contact.x, dz=target.z-contact.z, dy=(BALL_RADIUS)-contact.y;
  let dist=Math.hypot(dx,dz); let t=Math.max(0.6, Math.min(1.25, dist/10));
  for(let i=0;i<12;i++){
    const vx=dx/t, vz=dz/t, vy=(dy+0.5*9.8*t*t)/t;
    let okNet=true;
    if((contact.z<0 && dz>0) || (contact.z>0 && dz<0)){
      const tNet=(0-contact.z)/vz;
      if(tNet>0 && tNet<t){
        const yNet=contact.y+vy*tNet-0.5*9.8*tNet*tNet;
        if(yNet<NET_HEIGHT+BALL_RADIUS+0.06) okNet=false;
      }
    }
    const apex = contact.y + (vy*vy)/(2*9.8);
    if(apex>=minApex && okNet) return {vx,vy,vz,t};
    t*=1.10;
  }
  const vx=dx/t, vz=dz/t, vy=(dy+0.5*9.8*t*t)/t; return {vx,vy,vz,t};
}
function planWithTime(contact,target,t){ const dx=target.x-contact.x, dz=target.z-contact.z, dy=(BALL_RADIUS)-contact.y; return {vx:dx/t, vy:(dy+0.5*9.8*t*t)/t, vz:dz/t, t}; }
function predictBounce(){
  const y0=ball.position.y, vy=ballVel.y; const a=0.5*9.8, b=-vy, c=(BALL_RADIUS - y0);
  const disc=b*b - 4*a*c; if(disc<=0) return {t:0.5, x:ball.position.x, z:ball.position.z};
  const t=(b + Math.sqrt(disc))/(2*a); const ax = ball.userData.curveAx || 0;
  const x = ball.position.x + ballVel.x*t + 0.5*ax*t*t; const z = ball.position.z + ballVel.z*t; return {t, x, z};
}
function canHit(fromMesh, isCPU=false){
  const reach = isCPU? 1.9 : 1.6; const p = fromMesh;
  const reachXY = new THREE.Vector2(ball.position.x - p.position.x, ball.position.z - p.position.z).length();
  const heightOK = Math.abs(ball.position.y - 1.1) < 1.1;
  const isMySide = (p===player1) ? (ball.position.z <= 0) : (ball.position.z >= 0);
  const comingToMe = (p===player1) ? (ballVel.z < 0) : (ballVel.z > 0);
  return reachXY < reach && heightOK && isMySide && comingToMe;
}
function contactPoint(ofMesh){ return ofMesh.localToWorld(new THREE.Vector3(0,1.1,0.36)); }
function inVolleyZone(ofMesh){ const z = ofMesh.position.z; if(ofMesh===player1) return z > -(SERVICE_DIST) && z < -0.2; else return z < (SERVICE_DIST) && z > 0.2; }

function strike(fromMesh,shotType){
  const isP = (fromMesh===player1);
  const allow = isP ? allowedShotsPlayer : allowedShotsCPU;
  if( shotType==='Slice' && !allow.slice) return;
  if( shotType==='Lob'   && !allow.lob)   return;
  if( shotType==='Topspin' && !allow.top) return;
  if(isServe){ const who=isP?1:2; if(who!==server) return; } else { if(isP && !canHit(fromMesh,false)) return; if(!isP && !canHit(fromMesh,true)) return; }
  const tgt=aimTarget(fromMesh,shotType);
  const contact=contactPoint(fromMesh);
  let plan=planBallistic(contact,{x:tgt.x,z:tgt.z},tgt.minApex);
  if(isP && inVolleyZone(fromMesh)){ const tFast = Math.max(0.25, plan.t/3); plan = planWithTime(contact,{x:tgt.x,z:tgt.z}, tFast); }
  ball.position.copy(contact); ballVel.set(plan.vx,plan.vy,plan.vz);
  ball.userData.spinType = shotType; ball.userData.spin = (shotType==='Lob')?0.15:(shotType==='Slice'?-0.35:+0.6);
  ball.userData.postBounce=false; ball.userData.checkedFirstBounce=false;
  if(shotType==='Slice'){ const dirSign = Math.sign(tgt.x - contact.x) || (tgt.dir||1); ball.userData.curveAx = -4.2 * dirSign; } else { ball.userData.curveAx = 0; }
  hitter=fromMesh; receiver=isP?player2:player1; rallying=true; isServe=false;
  shotEl.textContent=`Golpe: ${shotType}${(isP && inVolleyZone(fromMesh))?' (Voleio 3×)':''}`; SFX.hit();
}

function cpuThink(dt){
  if(ballVel.z>0){ const pred = predictBounce(); const targetX = THREE.MathUtils.clamp(pred.x, -(HALF_W+EXTRA_OUT), (HALF_W+EXTRA_OUT));
    const targetZ = Math.min(PLAYER_BASE_Z, Math.max(0.6, pred.z - 0.9));
    const dx = targetX - player2.position.x; const dz = targetZ - player2.position.z;
    player2.position.x += THREE.MathUtils.clamp(dx, -CPU_SPEED*dt, CPU_SPEED*dt);
    player2.position.z += THREE.MathUtils.clamp(dz, -CPU_SPEED*dt, CPU_SPEED*dt);
  }else{ const dx = -player2.position.x; const dz = (PLAYER_BASE_Z - player2.position.z)*0.6;
    player2.position.x += THREE.MathUtils.clamp(dx, -3.2*dt, 3.2*dt);
    player2.position.z += THREE.MathUtils.clamp(dz, -3.2*dt, 3.2*dt);
  }
  let aimKey = (Math.random()<.5)?'a':'d';
  const options=[]; if(allowedShotsCPU.top) options.push('Topspin'); if(allowedShotsCPU.slice) options.push('Slice'); if(allowedShotsCPU.lob) options.push('Lob');
  const type = options[Math.floor(Math.random()*options.length)];
  if(isServe && server===2){ keys.add(aimKey); strike(player2,type); keys.delete(aimKey); }
  else if(!isServe && canHit(player2,true)){ keys.add(aimKey); strike(player2,type); keys.delete(aimKey); }
  player2.position.x = THREE.MathUtils.clamp(player2.position.x, -(HALF_W+EXTRA_OUT), (HALF_W+EXTRA_OUT));
  player2.position.z = THREE.MathUtils.clamp(player2.position.z, 0.6, (COURT_LENGTH/2 - 0.6));
}

function handlePlayer(dt){
  if(keys.has('w')) player1.position.z += 5.5*dt;
  if(keys.has('s')) player1.position.z -= 5.5*dt;
  if(keys.has('a')) player1.position.x += 5.5*dt;
  if(keys.has('d')) player1.position.x -= 5.5*dt;
  player1.position.x = THREE.MathUtils.clamp(player1.position.x,-(HALF_W+EXTRA_OUT), (HALF_W+EXTRA_OUT));
  player1.position.z = THREE.MathUtils.clamp(player1.position.z, -(COURT_LENGTH/2 - 0.8), -0.6);
  if(keys.has('j')){ strike(player1, 'Topspin'); keys.delete('j'); }
  if(keys.has('k')){ strike(player1, 'Slice');   keys.delete('k'); }
  if(keys.has('l')){ strike(player1, 'Lob');     keys.delete('l'); }
}

function awardPointTo(meshWinner){
  if(meshWinner===player1) pointsYou++; else pointsCPU++;
  SFX.point();
  if(pointsYou>=4 || pointsCPU>=4){
    if(Math.abs(pointsYou-pointsCPU)>=2){
      if(pointsYou>pointsCPU) gamesYou++; else gamesCPU++;
      pointsYou=pointsCPU=0; SFX.game();
      if(gamesYou>=2 || gamesCPU>=2){ matchOver=true; showFinal(gamesYou>gamesCPU); return; }
      startNewGame(); return;
    }
  }
  updateScoreText(); resetForNextPoint(false);
}
function showFinal(youWin){
  finalTitle.textContent = youWin? `Fase ${phase} vencida! 🏆` : `Fase ${phase} perdida 😅`;
  finalSubtitle.textContent = `Placar: ${gamesYou}–${gamesCPU}`;
  continueBtn.style.display = youWin && phase<3 ? 'inline-block' : 'none';
  restartBtn.textContent = youWin && phase<3 ? 'Repetir fase' : 'Jogar de novo';
  finalEl.style.display='flex'; (youWin?SFX.win:SFX.lose)();
}
continueBtn.onclick = ()=>{ finalEl.style.display='none'; setPhase(phase+1); };
restartBtn.onclick  = ()=>{ finalEl.style.display='none'; setPhase(phase); };

function resetForNextPoint(){ rallying=false; isServe=true; placeForServe(); shotEl.textContent='Golpe: —'; }
function startNewGame(){ server = (server===1)?2:1; updateScoreText(); resetForNextPoint(); }
function resetMatch(){ finalEl.style.display='none'; setPhase(1); }

function firstBounceIsIn(){
  const xOK = Math.abs(ball.position.x) <= HALF_W + 1e-6;
  const zOK = (receiver===player2) ? (ball.position.z >= 0 && ball.position.z <= COURT_LENGTH/2 + 1e-6) 
                                   : (ball.position.z <= 0 && ball.position.z >= -COURT_LENGTH/2 - 1e-6);
  return xOK && zOK;
}

function updateBall(dt){
  if(matchOver) return;
  if(!rallying && !isServe) return;
  if(isServe){ /* idle */ }
  else{
    if(ball.userData.curveAx){ ballVel.x += ball.userData.curveAx * dt; }
    ballVel.y -= 9.8*dt;
    ball.position.addScaledVector(ballVel, dt);
    if(Math.abs(ball.position.z)<NET_THICK/2 && ball.position.y<=NET_HEIGHT+BALL_RADIUS){
      ballVel.z*=-0.35; ballVel.x*=0.7; ballVel.y=Math.abs(ballVel.y)*0.3;
      ball.position.z=Math.sign(ballVel.z)*(NET_THICK/2+BALL_RADIUS); SFX.net();
    }
    if(ball.position.y-BALL_RADIUS<=0 && ballVel.y<0){
      if(!ball.userData.checkedFirstBounce){ ball.userData.checkedFirstBounce=true; if(!firstBounceIsIn()){ awardPointTo(receiver); return; } }
      ball.position.y=BALL_RADIUS; ballVel.y*=-0.55;
      if(!ball.userData.postBounce){
        ballVel.z *= (1.0 + 0.55*ball.userData.spin);
        ballVel.x *= (1.0 + 0.35*ball.userData.spin);
        if(ball.userData.spinType==='Lob'){ ballVel.z*=0.72; ballVel.x*=0.72; }
        ball.userData.postBounce=true; ball.userData.curveAx = 0;
      }
      SFX.bounce();
    }
    if((receiver===player1 && ball.position.z<-COURT_LENGTH/2-0.5) || (receiver===player2 && ball.position.z>COURT_LENGTH/2+0.5)){ awardPointTo(hitter); return; }
  }
}

function placeForServe(){
  const xClamp = (x)=> Math.max(-HALF_W+0.3, Math.min(HALF_W-0.3, x));
  if(server===1){ ball.position.set(xClamp(player1.position.x),1.0,-PLAYER_BASE_Z+1.2); hitter=null; receiver=player2; }
  else{ ball.position.set(xClamp(player2.position.x),1.0, PLAYER_BASE_Z-1.2); hitter=null; receiver=player1; }
  ballVel.set(0,0,0);
}

let last=performance.now();
function tick(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  if(!paused){ handlePlayer(dt); cpuThink(dt); updateBall(dt); }
  const camX = player1.position.x*0.30;
  camera.position.lerp(new THREE.Vector3(camX, 18.0, -COURT_LENGTH*0.95), 0.08);
  camera.lookAt(new THREE.Vector3(0, 0.6, -COURT_LENGTH*0.25));
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function togglePause(){ paused=!paused; document.getElementById('pause').style.display=paused?'flex':'none'; }

setPhase(1);
})(); 
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js'); });
}
</script>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">

<title>RoboTennis</title>
<style>
  html,body{margin:0;height:100%;background:#0b3a65;font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .hud{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);padding:6px 10px;font-size:14px}
  #banner{align-self:center;margin-top:6px;background:rgba(0,0,0,.35);border-radius:10px;padding:6px 10px;font-weight:600;letter-spacing:.2px;max-width:92%;text-align:center}
  #score{font-size:15px}
  #shot{font-weight:700}
  #pause{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;z-index:5}
  #final{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.75)); color:#fff; text-align:center; z-index:6}
  #final h1{font-size:32px;margin:0 0 8px 0}
  #final p{margin:4px 0 12px 0;font-size:16px;opacity:.9}
  #final .buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #final button{pointer-events:auto;background:#10b981;border:0;color:#042; font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer}
  #final button.alt{background:#60a5fa;color:#031b4e}
  /* Touch controls */
  #controls{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:env(safe-area-inset-bottom,12px) 10px 12px 10px;gap:8px;z-index:4}
  .pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;width:36vw;max-width:260px;aspect-ratio:1/1;padding:8px;border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
  .pad button,.panel button{border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:14px;padding:10px 8px;touch-action:none}
  .pad button:active,.panel button:active{background:rgba(255,255,255,.28)}
  .panel{pointer-events:auto;display:grid;gap:6px;width:36vw;max-width:260px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;padding:8px;border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px)}
  .full{grid-column:1 / span 2}
  .small{font-size:12px;font-weight:700;padding:8px}
  #pauseBtn{position:fixed;top:10px;right:10px;z-index:7;pointer-events:auto;background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:12px;padding:8px 10px;font-weight:800}
  #soundBtn{position:fixed;top:10px;left:10px;z-index:7;pointer-events:auto;background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:12px;padding:8px 10px;font-weight:800}
  #audioUnlock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);color:#fff;z-index:8;flex-direction:column;gap:10px}
  #audioUnlock button{background:#10b981;border:0;color:#042;font-weight:800;padding:12px 16px;border-radius:12px}
  #motionTray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0) + 72px);z-index:6;background:rgba(0,0,0,.35);color:#fff;border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;pointer-events:auto}
  #motionTray input[type=range]{vertical-align:middle}
  @media (min-aspect-ratio: 10/9){ .pad,.panel{width:30vw} }
</style>
</head>
<body>
<button id="pauseBtn">⏸</button>
<button id="soundBtn">🔇 Som</button>

<div id="audioUnlock">
  <div style="font-size:18px;font-weight:800">Ativar som</div>
  <div style="opacity:.9;max-width:80%;text-align:center">No iOS o áudio só liga após um toque. Toque abaixo para habilitar.</div>
  <button id="unlockBtn">Ativar áudio</button>
</div>

<div id="ui">
  <div class="hud" id="help">
    <div id="banner">PWA • Add to Home Screen • Campanha 3 fases • D‑pad move • Giroscópio opcional • AIM ⟵/⟶ • Topspin/Slice/Lob • Voleio 3×</div>
    <div id="score">Games 0–0 | Pontos: 0–0 | Saque: Você</div>
    <div id="shot">Golpe: —</div>
  </div>
</div>
<div id="pause">PAUSADO – toque ⏸</div>
<div id="final">
  <h1 id="finalTitle">Você venceu!</h1>
  <p id="finalSubtitle">Placar final</p>
  <div class="buttons">
    <button id="continueBtn" class="alt">Continuar</button>
    <button id="restartBtn">Reiniciar fase</button>
  </div>
</div>

<div id="controls" aria-hidden="false">
  <div class="pad" id="dpad">
    <div></div><button data-k="w">▲</button><div></div>
    <button data-k="a">◀</button><div></div><button data-k="d">▶</button>
    <div></div><button data-k="s">▼</button><div></div>
  </div>
  <div class="panel" id="panel">
    <button class="small" data-k="aimL">AIM ⟵</button>
    <button class="small" data-k="aimR">AIM ⟶</button>
    <button class="full" data-k="j">Topspin (J)</button>
    <button class="full" data-k="k">Slice (K)</button>
    <button class="full" data-k="l">Lob (L)</button>
  </div>
</div>

<div id="motionTray">
  <button id="motionBtn">🎮 Giroscópio: OFF</button>
  <label style="font-size:12px">Sensibilidade
    <input id="motionSens" type="range" min="0" max="100" value="35">
  </label>
</div>

<script>
// --- Audio unlock + mute ---
let actx=null, master=null;
function resumeAudio(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=.6; master.connect(actx.destination);} else if(actx.state==='suspended'){ actx.resume(); } }
const soundBtn  = document.getElementById('soundBtn');
const unlockUI  = document.getElementById('audioUnlock');
function unlockAudioNow(){
  resumeAudio();
  try { if (window.SFX && SFX.point) SFX.point(); } catch(e){}
  unlockUI.style.display = 'none';
}
document.getElementById('unlockBtn').onclick = unlockAudioNow;
window.addEventListener('touchstart', function once(){ unlockAudioNow(); window.removeEventListener('touchstart', once, {passive:true});},{passive:true});
soundBtn.onclick = ()=>{
  if (!actx) resumeAudio();
  const isMuted = (master && master.gain.value===0);
  master.gain.value = isMuted ? 0.6 : 0;
  soundBtn.textContent = isMuted ? '🔇 Som' : '🔊 Som';
};
</script>

<script>
// --- Giroscópio ---
let motionOn=false, tiltX=0, tiltY=0, sens=0.35;
const motionBtn=document.getElementById('motionBtn');
const motionSens=document.getElementById('motionSens');
function onOrient(e){ tiltX=(e.gamma||0); tiltY=(e.beta||0); }
function setMotionHandlers(on){
  if(on){
    if (typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(state=>{
        if(state==='granted'){ window.addEventListener('deviceorientation', onOrient, true); }
        else{ alert('Permissão do giroscópio negada.'); motionOn=false; motionBtn.textContent='🎮 Giroscópio: OFF'; }
      }).catch(()=>{ alert('Não foi possível solicitar o giroscópio.'); motionOn=false; motionBtn.textContent='🎮 Giroscópio: OFF'; });
    } else {
      window.addEventListener('deviceorientation', onOrient, true);
    }
  }else{
    window.removeEventListener('deviceorientation', onOrient, true);
    tiltX=tiltY=0;
  }
}
motionBtn.onclick=()=>{ motionOn=!motionOn; motionBtn.textContent=motionOn?'🎮 Giroscópio: ON':'🎮 Giroscópio: OFF'; setMotionHandlers(motionOn); };
motionSens.oninput=()=>{ sens=Number(motionSens.value)/100; };

// HOOK no movimento do player: procura uma função handlePlayer global e envolve
const _hook = setInterval(()=>{
  if (typeof handlePlayer === 'function' && typeof player1 !== 'undefined'){
    const _orig = handlePlayer;
    window.handlePlayer = function(dt){
      _orig(dt);
      if(motionOn && typeof player1!=='undefined'){
        const factor = sens * 0.12;
        player1.position.x += (-tiltX) * factor;
        player1.position.z += ( tiltY) * factor;
        const HALF_W=8.23/2, EXTRA_OUT=2.0, COURT_LENGTH=23.77;
        player1.position.x = Math.max(-(HALF_W+EXTRA_OUT), Math.min((HALF_W+EXTRA_OUT), player1.position.x));
        player1.position.z = Math.max(-(COURT_LENGTH/2 - 0.8), Math.min(-0.6, player1.position.z));
      }
    };
    clearInterval(_hook);
  }
}, 100);
</script>
